<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FrontFritas — Conquête territoriale</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <!-- HUD -->
      <div id="hud" class="hidden">
        <div id="topbar">
          <div class="stat"><span class="label">Troupes</span><span id="stat-troops">0</span></div>
          <div class="stat"><span class="label">Territoire</span><span id="stat-tiles">0</span></div>
          <div class="stat"><span class="label">Joueurs</span><span id="stat-alive">0</span></div>
        </div>

        <div id="leaderboard"></div>

        <div id="controls">
          <div id="ratio-wrap">
            <span class="label">Attaque : <span id="ratio-val">50%</span></span>
            <input id="ratio" type="range" min="1" max="100" value="50" />
          </div>
          <div id="hint">Clic gauche : attaquer / s'étendre &nbsp;·&nbsp; Molette : zoom &nbsp;·&nbsp; Clic droit : déplacer</div>
        </div>
      </div>

      <!-- Menu de départ -->
      <div id="menu">
        <div class="menu-card">
          <h1>Front<span>Fritas</span></h1>
          <p class="tagline">Conquête territoriale en temps réel</p>

          <button id="discord-btn" class="discord hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M20.32 4.37A19.8 19.8 0 0 0 15.4 2.9a13.9 13.9 0 0 0-.63 1.28 18.3 18.3 0 0 0-5.53 0A13.4 13.4 0 0 0 8.6 2.9a19.7 19.7 0 0 0-4.93 1.47C.55 9.05-.3 13.6.13 18.1a19.9 19.9 0 0 0 6.05 3.05c.49-.66.92-1.36 1.29-2.1-.71-.27-1.39-.6-2.03-.99.17-.12.34-.26.5-.39a14.2 14.2 0 0 0 12.12 0c.17.14.34.27.5.39-.64.39-1.32.72-2.03.99.37.74.8 1.44 1.29 2.1a19.8 19.8 0 0 0 6.05-3.05c.5-5.2-.85-9.72-3.56-13.73ZM8.02 15.33c-1.18 0-2.16-1.08-2.16-2.42 0-1.33.95-2.42 2.16-2.42 1.22 0 2.19 1.1 2.17 2.42 0 1.34-.95 2.42-2.17 2.42Zm7.96 0c-1.18 0-2.16-1.08-2.16-2.42 0-1.33.96-2.42 2.16-2.42 1.22 0 2.19 1.1 2.17 2.42 0 1.34-.95 2.42-2.17 2.42Z"/>
            </svg>
            <span>Connexion via Discord</span>
          </button>
          <p id="discord-status" class="credits hidden"></p>

          <label class="field">
            <span>Ton pseudo</span>
            <input id="name-input" type="text" maxlength="14" value="Toi" />
          </label>

          <label class="field">
            <span>Couleur</span>
            <div id="color-picker"></div>
          </label>

          <label class="field">
            <span>Bots : <b id="bots-val">14</b></span>
            <input id="bots-input" type="range" min="1" max="30" value="14" />
          </label>

          <label class="field">
            <span>Taille de la carte</span>
            <select id="size-input">
              <option value="small">Petite</option>
              <option value="medium" selected>Moyenne</option>
              <option value="large">Grande</option>
            </select>
          </label>

          <button id="play-btn">Jouer</button>
          <p class="credits">Inspiré d'OpenFront.io · flèches ZQSD/WASD pour naviguer</p>
        </div>
      </div>

      <!-- Fin de partie -->
      <div id="gameover" class="hidden">
        <div class="menu-card">
          <h2 id="go-title">Victoire</h2>
          <p id="go-sub"></p>
          <button id="replay-btn">Rejouer</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
